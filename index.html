<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Marketing Agen</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase App & Firestore SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- ================= VIEW: LOGIN ================= -->
    <div id="loginSection" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-200">
            <div class="text-center mb-8">
                <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Portal Agen Marketing</h1>
                <p class="text-slate-500 text-sm mt-1">Silakan masuk untuk melanjutkan pendaftaran</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Pilih / Nama Agen</label>
                    <select id="loginUsername" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50">
                        <option value="">-- Pilih Akun Agen Anda --</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Kata Sandi (Password)</label>
                    <input type="password" id="loginPassword" required placeholder="Masukkan kata sandi" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-md">
                    Masuk ke Sistem
                </button>
            </form>

            <div id="loginError" class="mt-4 hidden bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-lg text-sm text-center"></div>
        </div>
    </div>

    <!-- ================= VIEW: DASHBOARD UTAMA ================= -->
    <div id="mainSection" class="hidden flex-grow flex flex-col">
        <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-20">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-3">
                    <div class="bg-white/10 p-2.5 rounded-lg">
                        <i class="fa-solid fa-network-wired text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-bold leading-tight">Portal Pendaftaran Marketing</h1>
                        <p class="text-xs text-indigo-200" id="currentLoginInfo">Login sebagai: -</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openChangePasswordModal()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-key"></i> Ganti Password
                    </button>
                    <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 text-xs px-3 py-2 rounded-lg font-medium transition flex items-center gap-1.5">
                        <i class="fa-solid fa-right-from-bracket"></i> Keluar
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                    <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-user-plus text-indigo-600"></i> Form Pendaftaran
                    </h2>

                    <form id="registrationForm" onsubmit="registerMarketing(event)" class="space-y-4">
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-sm font-semibold text-slate-700">Nama Agen Pendaftar</label>
                                <button type="button" id="manageAgentBtn" onclick="openAgentModal()" class="text-xs text-indigo-600 hover:underline font-semibold flex items-center gap-1">
                                    <i class="fa-solid fa-gear"></i> Kelola Agen
                                </button>
                            </div>
                            <select id="agenSelect" required class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-slate-50 text-sm">
                                <option value="">-- Pilih Agen --</option>
                            </select>
                            <p id="agentLockNotice" class="text-xs text-amber-600 mt-1 hidden"><i class="fa-solid fa-lock"></i> Terkunci sesuai akun agen Anda.</p>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Nama Lengkap Marketing</label>
                            <input type="text" id="marketingName" required placeholder="Contoh: Budi Santoso" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Nomor NIK (16 Digit)</label>
                            <input type="text" id="marketingNik" required maxlength="16" pattern="[0-9]{16}" placeholder="Contoh: 3201123456789001" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        </div>

                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition duration-200 text-sm shadow-md">
                            Daftarkan Marketing
                        </button>
                    </form>
                    <div id="formAlert" class="mt-4 hidden p-3 rounded-lg text-xs font-medium"></div>
                </div>
            </div>

            <div class="lg:col-span-2 space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 flex flex-col h-full">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                        <h2 class="text-lg font-bold text-slate-900">Daftar Marketing Terdaftar</h2>
                        <input type="text" id="searchInput" oninput="renderTable()" placeholder="Cari Nama / NIK / Agen..." class="w-full sm:w-64 px-3 py-2 rounded-lg border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>

                    <div class="overflow-x-auto flex-grow border border-slate-100 rounded-xl">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase">
                                    <th class="p-3.5 font-semibold">No</th>
                                    <th class="p-3.5 font-semibold">Nama Marketing</th>
                                    <th class="p-3.5 font-semibold">Nomor NIK</th>
                                    <th class="p-3.5 font-semibold">Agen Pendaftar</th>
                                    <th class="p-3.5 font-semibold text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="marketingTableBody" class="divide-y divide-slate-100 text-sm"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- ================= MODAL KELOLA AGEN & LAINNYA ================= -->
    <div id="agentModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-200 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-base">Kelola Data Agen</h3>
                <button onclick="closeAgentModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6">
                <form onsubmit="addNewAgent(event)" class="flex gap-2">
                    <input type="text" id="newAgentNameInput" required placeholder="Nama Agen Baru..." class="flex-grow px-3 py-2 rounded-lg border border-slate-300 text-sm">
                    <button type="submit" class="bg-indigo-600 text-white font-semibold px-4 py-2 rounded-lg text-sm">Tambah</button>
                </form>
                <div class="border rounded-xl overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-slate-50 border-b text-xs"><th class="p-3">Nama Agen</th><th class="p-3 text-center">Aksi</th></tr></thead>
                        <tbody id="agentTableList" class="divide-y text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="changePasswordModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
            <div class="bg-slate-50 px-6 py-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-slate-800 text-base">Ganti Kata Sandi Akun</h3>
                <button onclick="closeChangePasswordModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="submitChangePassword(event)" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Kata Sandi Lama</label>
                    <input type="password" id="oldPasswordInput" required class="w-full px-3 py-2 rounded-lg border text-sm">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Kata Sandi Baru</label>
                    <input type="password" id="newPasswordInput" required class="w-full px-3 py-2 rounded-lg border text-sm">
                </div>
                <div id="changePassAlert" class="hidden p-2.5 rounded text-xs"></div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeChangePasswordModal()" class="bg-slate-200 px-4 py-2 rounded text-sm">Batal</button>
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded text-sm font-semibold">Simpan Sandi</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= JAVASCRIPT & FIREBASE INTEGRATION ================= -->
    <script>
        // --- KONFIGURASI FIREBASE ANDA ---
        const firebaseConfig = {
            apiKey: "MASUKKAN_API_KEY_ANDA_DISINI",
            authDomain: "MASUKKAN_AUTH_DOMAIN_ANDA",
            projectId: "MASUKKAN_PROJECT_ID",
            storageBucket: "MASUKKAN_STORAGE_BUCKET",
            messagingSenderId: "MASUKKAN_MESSAGING_SENDER_ID",
            appId: "MASUKKAN_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const DEFAULT_AGENTS = [
            "KANTOR PUSAT EMBUN NABAWI",
            "YASIR MURJANI (WNA TEAM)",
            "HJ. NISA (LARIS MANIS)",
            "UMMI JAMILAH",
            "ROBI (MUBARAK GRUP)",
            "FIEKRI (AMI AWAD & HAFIZ)",
            "GURU SHOPIA HADI",
            "MAHUD"
        ];

        let agents = [];
        let passwords = {};
        let marketingList = [];
        let currentUser = localStorage.getItem('pendaftaran_current_user') || null;

        // Ambil data real-time dari Firestore agar tidak hilang saat relog/ganti device
        function initRealtimeSync() {
            // Sinkronisasi Agen & Password
            db.collection("settings").doc("app_data").onSnapshot((doc) => {
                if (doc.exists) {
                    agents = doc.data().agents || DEFAULT_AGENTS;
                    passwords = doc.data().passwords || {};
                } else {
                    agents = DEFAULT_AGENTS;
                    agents.forEach(a => passwords[a] = "123456");
                    saveAppDataToCloud();
                }
                if (currentUser) showDashboard();
                else showLogin();
            });

            // Sinkronisasi Data Marketing
            db.collection("marketing").onSnapshot((snapshot) => {
                marketingList = [];
                snapshot.forEach((doc) => {
                    marketingList.push({ id: doc.id, ...doc.data() });
                });
                renderTable();
            });
        }

        function saveAppDataToCloud() {
            db.collection("settings").doc("app_data").set({
                agents: agents,
                passwords: passwords
            });
        }

        window.onload = function() {
            initRealtimeSync();
        };

        function showLogin() {
            const select = document.getElementById('loginUsername');
            select.innerHTML = '<option value="">-- Pilih Akun Agen Anda --</option>';
            agents.forEach(agent => {
                const opt = document.createElement('option');
                opt.value = agent;
                opt.textContent = agent === "KANTOR PUSAT EMBUN NABAWI" ? "⭐ " + agent + " (Admin Pusat)" : agent;
                select.appendChild(opt);
            });
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const pass = document.getElementById('loginPassword').value;
            const errorDiv = document.getElementById('loginError');

            if (passwords[username] && passwords[username] === pass) {
                currentUser = username;
                localStorage.setItem('pendaftaran_current_user', currentUser);
                errorDiv.classList.add('hidden');
                showDashboard();
            } else {
                errorDiv.textContent = "Kata sandi salah!";
                errorDiv.classList.remove('hidden');
            }
        }

        function handleLogout() {
            currentUser = null;
            localStorage.removeItem('pendaftaran_current_user');
            showLogin();
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            const isAdmin = (currentUser === "KANTOR PUSAT EMBUN NABAWI");
            document.getElementById('currentLoginInfo').textContent = `Login: ${currentUser} ${isAdmin ? '(Admin Pusat)' : '(Agen)'}`;
            
            const select = document.getElementById('agenSelect');
            select.innerHTML = '<option value="">-- Pilih Agen --</option>';
            agents.forEach(ag => {
                const opt = document.createElement('option');
                opt.value = ag;
                opt.textContent = ag;
                select.appendChild(opt);
            });

            if (!isAdmin) {
                select.value = currentUser;
                select.disabled = true;
                document.getElementById('agentLockNotice').classList.remove('hidden');
                document.getElementById('manageAgentBtn').classList.add('hidden');
            } else {
                select.disabled = false;
                document.getElementById('agentLockNotice').classList.add('hidden');
                document.getElementById('manageAgentBtn').classList.remove('hidden');
            }
            renderTable();
        }

        async function registerMarketing(e) {
            e.preventDefault();
            const agen = document.getElementById('agenSelect').value;
            const nama = document.getElementById('marketingName').value.trim();
            const nik = document.getElementById('marketingNik').value.trim();

            if (nik.length !== 16 || isNaN(nik)) {
                alert("NIK harus tepat 16 digit angka!");
                return;
            }

            // Validasi NIK unik lintas agen dari database cloud
            const existing = marketingList.find(m => m.nik === nik);
            if (existing) {
                alert(`Gagal! NIK ${nik} sudah terdaftar di Agen "${existing.agen}" atas nama ${existing.nama}.`);
                return;
            }

            await db.collection("marketing").add({
                agen: agen,
                nama: nama,
                nik: nik,
                inputBy: currentUser,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('registrationForm').reset();
            if (currentUser !== "KANTOR PUSAT EMBUN NABAWI") {
                document.getElementById('agenSelect').value = currentUser;
            }
            alert("Marketing berhasil didaftarkan secara online!");
        }

        function renderTable() {
            const tbody = document.getElementById('marketingTableBody');
            const keyword = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';
            if (!tbody) return;
            tbody.innerHTML = '';

            const filtered = marketingList.filter(m => 
                m.nama.toLowerCase().includes(keyword) || 
                m.nik.toLowerCase().includes(keyword) || 
                m.agen.toLowerCase().includes(keyword)
            );

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center p-6 text-slate-400">Belum ada data marketing terdaftar.</td></tr>`;
                return;
            }

            const isAdmin = (currentUser === "KANTOR PUSAT EMBUN NABAWI");
            filtered.forEach((m, idx) => {
                const canManage = isAdmin || (m.inputBy === currentUser);
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition border-b border-slate-100";
                tr.innerHTML = `
                    <td class="p-3.5 text-slate-500">${idx + 1}</td>
                    <td class="p-3.5 font-medium text-slate-900">${m.nama}</td>
                    <td class="p-3.5 font-mono text-slate-600">${m.nik}</td>
                    <td class="p-3.5"><span class="bg-indigo-50 text-indigo-700 text-xs px-2.5 py-1 rounded-full font-medium">${m.agen}</span></td>
                    <td class="p-3.5 text-center">
                        ${canManage ? `<button onclick="deleteMarketing('${m.id}')" class="text-rose-600 hover:text-rose-800 p-1 rounded" title="Hapus"><i class="fa-solid fa-trash"></i></button>` : `<span class="text-xs text-slate-400 italic">Dibaca Saja</span>`}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteMarketing(id) {
            if (confirm("Yakin ingin menghapus data marketing ini?")) {
                await db.collection("marketing").doc(id).delete();
            }
        }

        function openChangePasswordModal() {
            document.getElementById('oldPasswordInput').value = '';
            document.getElementById('newPasswordInput').value = '';
            document.getElementById('changePassAlert').classList.add('hidden');
            document.getElementById('changePasswordModal').classList.remove('flex');
            document.getElementById('changePasswordModal').classList.add('flex');
        }

        function closeChangePasswordModal() {
            document.getElementById('changePasswordModal').classList.remove('flex');
            document.getElementById('changePasswordModal').classList.add('hidden');
        }

        async function submitChangePassword(e) {
            e.preventDefault();
            const oldPass = document.getElementById('oldPasswordInput').value;
            const newPass = document.getElementById('newPasswordInput').value;
            const alertBox = document.getElementById('changePassAlert');

            if (passwords[currentUser] !== oldPass) {
                alertBox.textContent = "Kata sandi lama salah!";
                alertBox.className = "p-2.5 rounded text-xs bg-red-50 text-red-700 border border-red-200 block";
                return;
            }

            passwords[currentUser] = newPass;
            await saveAppDataToCloud();

            alertBox.textContent = "Kata sandi berhasil disimpan secara permanen!";
            alertBox.className = "p-2.5 rounded text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 block";
            setTimeout(() => { closeChangePasswordModal(); }, 1500);
        }

        function openAgentModal() {
            const listBody = document.getElementById('agentTableList');
            listBody.innerHTML = '';
            agents.forEach(agent => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="p-3 font-medium text-slate-800">${agent}</td><td class="p-3 text-center">-</td>`;
                listBody.appendChild(tr);
            });
            document.getElementById('agentModal').classList.remove('hidden');
            document.getElementById('agentModal').classList.add('flex');
        }

        function closeAgentModal() {
            document.getElementById('agentModal').classList.remove('flex');
            document.getElementById('agentModal').classList.add('hidden');
        }
    </script>
</body>
</html>
